# Shared nginx server block for every MiqorAI portal image.
# Installed as /etc/nginx/templates/default.conf.template; the nginx entrypoint
# renders it with envsubst into /etc/nginx/conf.d/default.conf at start-up.
# Only variables defined in the container environment are substituted, so nginx
# runtime variables ($uri etc.) are left untouched.

server {
    # IPv4 only: a [::] listener fails to start on clusters with IPv6 disabled.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # Liveness/readiness probe target (Docker HEALTHCHECK and Kubernetes probes).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API is never served by a portal container. In Kubernetes the Ingress
    # sends /api to the API Service before it reaches nginx; answering 404 here
    # keeps a misrouted call from receiving index.html with HTTP 200.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"API is not served by the portal host"}}';
    }

    # Content-hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry point must always be revalidated so a deploy is picked up
    # immediately instead of browsers running stale bundles.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else (unhashed public files and client-side routes).
    # Unknown paths fall back to the SPA entry point.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
