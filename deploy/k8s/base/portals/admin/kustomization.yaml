# admin portal = shared template + name, selector label and image.
# Image is built with: --build-arg PORTAL=admin-portal
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../template
namePrefix: admin-
labels:
  - pairs:
      app.kubernetes.io/name: admin-portal
    includeSelectors: true
images:
  - name: miqorai-portal
    newName: miqorai-admin-portal
