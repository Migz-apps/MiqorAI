# pharmacy portal = shared template + name, selector label and image.
# Image is built with: --build-arg PORTAL=pharmacy-portal
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../template
namePrefix: pharmacy-
labels:
  - pairs:
      app.kubernetes.io/name: pharmacy-portal
    includeSelectors: true
images:
  - name: miqorai-portal
    newName: miqorai-pharmacy-portal
