# hospital portal = shared template + name, selector label and image.
# Image is built with: --build-arg PORTAL=hospital-portal
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../template
namePrefix: hospital-
labels:
  - pairs:
      app.kubernetes.io/name: hospital-portal
    includeSelectors: true
images:
  - name: miqorai-portal
    newName: miqorai-hospital-portal
