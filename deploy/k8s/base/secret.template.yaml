# TEMPLATE ONLY - placeholders, never real values. Not included in any
# kustomization (so `kubectl apply -k` can never ship placeholders).
#
# Create the real Secret before the first apply, for example:
#   kubectl -n miqorai create secret generic miqorai-secrets --from-env-file=miqorai-secrets.env
# (keep miqorai-secrets.env outside the repository) or copy this file, fill it,
# and apply it with `kubectl apply -f`. Prefer an external secret manager
# (External Secrets Operator, Sealed Secrets, SOPS) for production.
apiVersion: v1
kind: Secret
metadata:
  name: miqorai-secrets
  namespace: miqorai
type: Opaque
stringData:
  # --- API + worker ---------------------------------------------------------
  # Managed Supabase (session pooler, port 5432) or the optional in-cluster Postgres:
  #   postgresql://miqorai:<POSTGRES_PASSWORD>@postgres:5432/miqorai
  DATABASE_URL: "postgresql://<user>:<password>@<host>:5432/<database>"
  # Managed Redis (TLS: rediss://) or the optional in-cluster Redis:
  #   redis://:<REDIS_PASSWORD>@redis:6379
  REDIS_URL: "rediss://default:<password>@<host>:6379"
  SUPABASE_SERVICE_ROLE_KEY: "<supabase-service-role-key>"
  JWT_SECRET: "<random-64-chars>"
  JWT_REFRESH_SECRET: "<different-random-64-chars>"
  ENCRYPTION_KEY: "<32-byte-encryption-key>"
  FILE_SIGNING_SECRET: "<random-secret>"
  QR_SECRET: "<random-secret>"
  SMTP_USER: "<smtp-user>"
  SMTP_PASS: "<smtp-password>"
  TWILIO_ACCOUNT_SID: "<twilio-account-sid>"
  TWILIO_AUTH_TOKEN: "<twilio-auth-token>"
  # Shared by the API (client) and the AI service (server): same value in both.
  AI_SERVICE_API_KEY: "<random-secret>"

  # --- Optional in-cluster data stores (components/in-cluster-data) --------
  POSTGRES_PASSWORD: "<postgres-password>"
  REDIS_PASSWORD: "<redis-password>"
