# Clinical-safety inference service (FastAPI + Qwen1.5-0.5B + LoRA adapter).
# Sized for CPU inference: the float32 0.5B model plus torch needs ~2.5-3 GiB.
# The base model is downloaded from the Hugging Face Hub on start-up into the
# cache volume (outbound HTTPS to huggingface.co required), hence the long
# startup probe. Reachable only from the API and worker (NetworkPolicy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/component: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai-service
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-service
          image: miqorai-ai-service
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: miqorai-ai-config
          env:
            - name: AI_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: miqorai-secrets
                  key: AI_SERVICE_API_KEY
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: hf-cache
              mountPath: /home/user/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        # Replace with a PVC to avoid re-downloading the base model on every restart.
        - name: hf-cache
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
