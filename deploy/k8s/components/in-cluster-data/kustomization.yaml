# OPTIONAL: in-cluster Postgres + Redis for dev / kind / minikube / air-gapped installs.
# Production uses managed Supabase Postgres and managed Redis instead: leave
# this component out and point DATABASE_URL / REDIS_URL (miqorai-secrets) at them.
# When used, set in miqorai-secrets:
#   DATABASE_URL=postgresql://miqorai:<POSTGRES_PASSWORD>@postgres:5432/miqorai
#   REDIS_URL=redis://:<REDIS_PASSWORD>@redis:6379
#   POSTGRES_PASSWORD, REDIS_PASSWORD
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - postgres.yaml
  - redis.yaml
