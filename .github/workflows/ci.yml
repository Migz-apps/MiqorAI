name: CI

# The deploy gate. render.yaml deploys with autoDeployTrigger "checksPass", so
# these jobs must pass before a commit reaches production; mark them as
# required checks in the master branch protection rule.
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web portals and shared packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production wiring
        run: npm run test:production:wiring

  server:
    name: API server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miqorai
          POSTGRES_PASSWORD: miqorai
          POSTGRES_DB: miqorai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miqorai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    # CI-only throwaway values; the suite runs against the miqorai_test database.
    env:
      DATABASE_URL: postgresql://miqorai:miqorai@localhost:5432/miqorai
      TEST_DATABASE_URL: postgresql://miqorai:miqorai@localhost:5432/miqorai_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-for-production
      ENCRYPTION_KEY: ci-encryption-key-not-for-production
      FILE_SIGNING_SECRET: ci-file-signing-secret-not-for-production
      QR_SECRET: ci-qr-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  mobile:
    name: Patient mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile_patient
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile_patient/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
