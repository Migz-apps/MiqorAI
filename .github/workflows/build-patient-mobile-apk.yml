name: Build Patient Mobile APK

on:
  push:
    branches: [master, main]
    paths:
      - "mobile_patient/**"
      - ".github/workflows/build-patient-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_patient

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile_patient/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install
        env:
          EXPO_PUBLIC_API_URL: https://miqorai.onrender.com

      - name: Sign release builds with the debug keystore (standalone installable APK)
        run: |
          # No production keystore is configured in CI; reuse the debug keystore so
          # the release-mode APK (JS bundle embedded, __DEV__=false) is installable.
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' android/app/build.gradle || true
          sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/' android/app/build.gradle || true

      - name: Configure Android SDK path
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_PATH" ]; then
            echo "Android SDK path was not configured by setup-android." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$SDK_PATH" > android/local.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace --console=plain
        working-directory: mobile_patient/android
        env:
          EXPO_PUBLIC_API_URL: https://miqorai.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: miqorai-patient-apk
          path: mobile_patient/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patient-mobile-apk-latest
          name: MiqorAI Patient Mobile APK
          make_latest: true
          files: mobile_patient/android/app/build/outputs/apk/release/app-release.apk
