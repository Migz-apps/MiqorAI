name: Deploy Patient Portal

on:
  push:
    branches: [master, main]
    paths:
      - "patient-portal-desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-patient-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-patient-portal
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w patient-portal-desktop

      - name: Lint
        run: npm run lint -w patient-portal-desktop

      - name: Test
        run: npm test -w patient-portal-desktop

      - name: Build
        run: npm run build -w patient-portal-desktop
        env:
          VITE_BASE: /MiqorAI/
          VITE_API_URL: https://miqorai.onrender.com

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: patient-portal-desktop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
