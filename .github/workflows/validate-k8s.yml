name: Validate Kubernetes manifests

# Renders every Kustomize overlay and validates the output against the
# Kubernetes OpenAPI schemas (strict: unknown fields fail). Nothing is applied.
on:
  pull_request:
    paths:
      - "deploy/k8s/**"
      - ".github/workflows/validate-k8s.yml"
  push:
    branches: [master, main]
    paths:
      - "deploy/k8s/**"
      - ".github/workflows/validate-k8s.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.6.7"
  KUBERNETES_VERSION: "1.30.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize and kubeconform
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kustomize
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build and validate overlays
        run: |
          set -euo pipefail
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::${overlay}"
            kustomize build "${overlay}" \
              | kubeconform -strict -summary -output text \
                  -kubernetes-version "${KUBERNETES_VERSION}" \
                  -ignore-missing-schemas
            echo "::endgroup::"
          done

      - name: Validate the Secret template
        run: |
          kubeconform -strict -summary -kubernetes-version "${KUBERNETES_VERSION}" \
            deploy/k8s/base/secret.template.yaml

      - name: Upload rendered manifests
        if: always()
        run: |
          mkdir -p rendered
          for overlay in deploy/k8s/overlays/*/; do
            name="$(basename "${overlay}")"
            kustomize build "${overlay}" > "rendered/${name}.yaml" || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 7
