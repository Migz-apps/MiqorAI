services:
  # Shared backend API (requires DATABASE_URL and secrets via .env or environment).
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  patient-portal:
    build:
      context: ./patient-portal-desktop
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped

  hospital-portal:
    build:
      context: ./hospital-portal
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  insurance-portal:
    build:
      context: ./insurance-portal
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    restart: unless-stopped

  pharmacy-portal:
    build:
      context: ./pharmacy-portal
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    restart: unless-stopped

  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: "8083"
    restart: unless-stopped
