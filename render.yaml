# Render Blueprint: MiqorAI API + background worker (https://render.com/docs/blueprint-spec).
#
# Topology: one web service (HTTP API) + one background worker built from the
# same server/ code. The worker runs the domain-event outbox and report
# schedules, so the API sets WORKER_INLINE=false (src/index.ts would otherwise
# start the same loops inside every API instance). Single-service fallback:
# delete the worker service and set WORKER_INLINE=true on the API.
#
# Secrets use sync: false - Render prompts for them on the first Blueprint
# apply and never stores them here. The worker reads the API's secret values
# through fromService, so each secret is entered once.
#
# Node: pinned through NODE_VERSION (the repo root .nvmrc says 22 as well).
# Deploy gate: autoDeployTrigger "checksPass" deploys a commit only after its
# GitHub checks (CI) pass. Pre-deploy commands require a paid instance type.

envVarGroups:
  - name: miqorai-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://api.miqorai.com
      - key: CORS_ORIGINS
        value: https://patient.miqorai.com,https://hospital.miqorai.com,https://insurance.miqorai.com,https://pharmacy.miqorai.com,https://admin.miqorai.com
      - key: PATIENT_PORTAL_URL
        value: https://patient.miqorai.com
      - key: HOSPITAL_PORTAL_URL
        value: https://hospital.miqorai.com
      - key: INSURANCE_PORTAL_URL
        value: https://insurance.miqorai.com
      - key: PHARMACY_PORTAL_URL
        value: https://pharmacy.miqorai.com
      - key: ADMIN_PORTAL_URL
        value: https://admin.miqorai.com
      - key: SUPABASE_STORAGE_BUCKET
        value: miqorai-uploads
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: QR_TTL_SECONDS
        value: "300"
      - key: OTP_EXPIRES_MINUTES
        value: "10"
      - key: PASSWORD_RESET_EXPIRES_MINUTES
        value: "60"
      - key: AUTH_CHALLENGE_RESEND_COOLDOWN_SECONDS
        value: "45"
      - key: AUTH_CHALLENGE_MAX_ATTEMPTS
        value: "5"
      - key: INVITATION_EXPIRY_DAYS
        value: "7"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_FROM
        value: noreply@miqorai.com
      - key: SMS_PROVIDER
        value: twilio
      - key: UPLOAD_DIR
        value: ./uploads
      - key: RATE_LIMIT_PER_USER_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_PER_IP_PER_MINUTE
        value: "600"
      - key: PLATFORM_TIMEZONE
        value: Africa/Kigali
      - key: SHUTDOWN_TIMEOUT_MS
        value: "10000"
      - key: TRUST_PROXY
        value: "1"
      - key: AUDIT_ARCHIVE_DAYS
        value: "365"
      - key: AI_SERVICE_BASE_URL
        value: https://mazimpakamiguel-miqorai.hf.space
      - key: AI_SERVICE_TIMEOUT_SECONDS
        value: "60"
      - key: AI_SERVICE_ENABLED
        value: "true"
      - key: MIQORAI_AI_MOCK
        value: "false"
      - key: CLINICAL_SAFETY_REQUIRED
        value: "true"

services:
  - type: web
    name: miqorai-server
    runtime: node
    # >>> CHANGE ME: plan and region. Pick the Render region closest to the
    # Supabase project region (e.g. Supabase eu-central-1 -> frankfurt,
    # us-east-1 -> virginia). A region cannot be changed after creation.
    plan: starter
    region: frankfurt
    rootDir: server
    buildFilter:
      paths:
        - server/**
        - render.yaml
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: miqorai-shared
      - key: WORKER_INLINE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FILE_SIGNING_SECRET
        sync: false
      - key: QR_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_REDIRECT_ALL_TO
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: SMS_FROM_NUMBER
        sync: false
      - key: AI_SERVICE_API_KEY
        sync: false

  - type: worker
    name: miqorai-worker
    runtime: node
    # Keep plan/region identical to miqorai-server.
    plan: starter
    region: frankfurt
    rootDir: server
    buildFilter:
      paths:
        - server/**
        - render.yaml
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: miqorai-shared
      - key: DATABASE_URL
        fromService: { type: web, name: miqorai-server, envVarKey: DATABASE_URL }
      - key: REDIS_URL
        fromService: { type: web, name: miqorai-server, envVarKey: REDIS_URL }
      - key: SUPABASE_URL
        fromService: { type: web, name: miqorai-server, envVarKey: SUPABASE_URL }
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: { type: web, name: miqorai-server, envVarKey: SUPABASE_SERVICE_ROLE_KEY }
      - key: JWT_SECRET
        fromService: { type: web, name: miqorai-server, envVarKey: JWT_SECRET }
      - key: JWT_REFRESH_SECRET
        fromService: { type: web, name: miqorai-server, envVarKey: JWT_REFRESH_SECRET }
      - key: ENCRYPTION_KEY
        fromService: { type: web, name: miqorai-server, envVarKey: ENCRYPTION_KEY }
      - key: FILE_SIGNING_SECRET
        fromService: { type: web, name: miqorai-server, envVarKey: FILE_SIGNING_SECRET }
      - key: QR_SECRET
        fromService: { type: web, name: miqorai-server, envVarKey: QR_SECRET }
      - key: SMTP_HOST
        fromService: { type: web, name: miqorai-server, envVarKey: SMTP_HOST }
      - key: SMTP_USER
        fromService: { type: web, name: miqorai-server, envVarKey: SMTP_USER }
      - key: SMTP_PASS
        fromService: { type: web, name: miqorai-server, envVarKey: SMTP_PASS }
      - key: EMAIL_REDIRECT_ALL_TO
        fromService: { type: web, name: miqorai-server, envVarKey: EMAIL_REDIRECT_ALL_TO }
      - key: TWILIO_ACCOUNT_SID
        fromService: { type: web, name: miqorai-server, envVarKey: TWILIO_ACCOUNT_SID }
      - key: TWILIO_AUTH_TOKEN
        fromService: { type: web, name: miqorai-server, envVarKey: TWILIO_AUTH_TOKEN }
      - key: SMS_FROM_NUMBER
        fromService: { type: web, name: miqorai-server, envVarKey: SMS_FROM_NUMBER }
      - key: AI_SERVICE_API_KEY
        fromService: { type: web, name: miqorai-server, envVarKey: AI_SERVICE_API_KEY }
